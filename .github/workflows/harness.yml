name: harness
on:
  push:
    paths: ["harness/**", "harness.html", "site/**", ".github/workflows/harness.yml"]
  pull_request:
    paths: ["harness/**", "harness.html", "site/**", ".github/workflows/harness.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Typecheck and unit tests.
      - run: npm test
      # A seeded rules-AI game replays identically, and the frozen golden
      # games still produce the same logs.
      - run: npx tsx src/cli.ts determinism --seed 7
      - run: npx tsx src/cli.ts golden check
      # No seat can see what its player could not.
      - run: npx tsx src/cli.ts invariant
      # Credits and clicks reconcile with the engine's own snapshots.
      - run: npx tsx src/cli.ts audit
      # Every checker catches a planted defect of each class it claims.
      - run: npx tsx src/cli.ts selftest
      # Mock-model games in every seat mode: retries, fallback, compaction,
      # forced and compound decisions, record validation. The low threshold
      # makes compaction happen in a keyless game.
      - run: npx tsx src/cli.ts llm-game --model mock --seed 3 --compact-threshold 40000
      - run: npx tsx src/cli.ts llm-game --seat corp --model mock --seed 8 --compact-threshold 40000 --invariant
      - run: npx tsx src/cli.ts llm-game --seat both --model mock --seed 8 --compact-threshold 40000 --invariant
      # A match with a rerun seed, so the divergence report runs.
      - run: npx tsx src/cli.ts run-match --model mock --seeds 1 --repeat 2 --label ci
      # Whole games through the MCP server, as chat apps play them.
      - run: npm run test:e2e
      # The fixture game re-simulates from its decisions and reproduces its
      # committed frames byte for byte.
      - run: npx tsx src/cli.ts frames --file fixtures/mock-game
      - run: git diff --exit-code -- fixtures/mock-game
      # The project page's data builds from the corpus.
      - run: npx tsx src/cli.ts site
