name: harness
on:
  push:
    paths: ["harness/**", "harness.html", ".github/workflows/harness.yml"]
  pull_request:
    paths: ["harness/**", "harness.html", ".github/workflows/harness.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      # M1 acceptance: a seeded rules-vs-rules game is reproducible.
      - run: npx tsx src/cli.ts determinism --seed 7
      # M2 acceptance: behavior matches the frozen golden fixtures.
      - run: npx tsx src/cli.ts golden check
      # M3 acceptance: no hidden information leaks from the state serializer.
      - run: npx tsx src/cli.ts invariant
      # M4.5 acceptance: golden games conserve credits and clicks against
      # the engine's own ground-truth snapshots.
      - run: npx tsx src/cli.ts audit
      # M4 acceptance (keyless): full LLM-seat game via the mock client,
      # exercising the retry, fallback, forced (D03 auto-resolve) and
      # exercising the retry, fallback, forced (D03 auto-resolve),
      # compaction (D01) and compound-fulfillment (D09) paths + JSONL
      # schema validation. The lowered threshold exists because
      # auto-resolve shrinks the transcript so much that the production
      # 150K would never be crossed keylessly. Seed 5 (not 7): under
      # compound menus the mock's seeded choices shift and seed 7's game
      # ends in a turn-2 flatline too short to cross the compaction
      # threshold; seed 5 runs 752 decisions and exercises every clause.
      - run: npx tsx src/cli.ts llm-game --model mock --seed 3 --compact-threshold 40000
